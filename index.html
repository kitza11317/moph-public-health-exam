<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12395b">
  <title>ข้อสอบจำลองนักวิชาการสาธารณสุข 100 ข้อ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="startScreen" class="card start-screen">
    <h1>ข้อสอบจำลองนักวิชาการสาธารณสุข</h1>
    <p>100 ข้อ • เวลา 180 นาที • เลือกคำตอบที่ดีที่สุดเพียงข้อเดียว</p>
    <label for="candidateName">ชื่อผู้เข้าสอบ</label>
    <input id="candidateName" type="text" autocomplete="name" placeholder="กรอกชื่อหรือชื่อเล่น">
    <p id="startError" class="error" hidden></p>
    <button id="startButton" class="btn primary" type="button">เริ่มทำข้อสอบ</button>
    <div class="note"><b>หมายเหตุ:</b> เป็นชุดฝึก ไม่ใช่ข้อสอบจริงของกระทรวง</div>
  </section>

  <div id="examScreen" hidden>
    <header>
      <div class="header-row">
        <div><strong>นักวิชาการสาธารณสุข • ชุดจำลอง 100 ข้อ</strong><br><small id="candidateDisplay"></small></div>
        <div id="timerDisplay" class="timer">03:00:00</div>
      </div>
    </header>
    <main>
      <section class="card content">
        <div id="questionMeta" class="meta"></div>
        <div id="questionText" class="question"></div>
        <div id="optionsBox"></div>
        <div class="actions">
          <button id="prevButton" class="btn secondary" type="button">← ก่อนหน้า</button>
          <button id="flagButton" class="btn warning" type="button">⚑ ทำเครื่องหมาย</button>
          <button id="nextButton" class="btn primary" type="button">ถัดไป →</button>
          <button id="submitButton" class="btn danger" type="button">ส่งข้อสอบ</button>
        </div>
      </section>
      <aside class="card sidebar">
        <strong id="statusText"></strong>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <div id="questionGrid" class="number-grid"></div>
        <p class="legend">เขียว = ตอบแล้ว • กรอบส้ม = ทำเครื่องหมาย • น้ำเงิน = ข้อปัจจุบัน</p>
      </aside>
    </main>
  </div>

  <section id="resultScreen" class="result-screen" hidden>
    <div class="card content">
      <div class="score-box"><h2>ผลการสอบ</h2><div id="scoreDisplay" class="big-score"></div><div id="resultSummary"></div></div>
      <h3>คะแนนรายหมวด</h3>
      <div class="table-wrap"><table><thead><tr><th>หมวด</th><th>ถูก</th><th>ทั้งหมด</th><th>%</th></tr></thead><tbody id="categoryRows"></tbody></table></div>
      <div class="actions">
        <button id="reviewButton" class="btn primary" type="button">ดูเฉลยละเอียด</button>
        <button id="restartButton" class="btn secondary" type="button">ทำใหม่</button>
        <button id="printButton" class="btn secondary" type="button">พิมพ์ผล</button>
      </div>
    </div>
    <div id="reviewBox" hidden></div>
  </section>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
